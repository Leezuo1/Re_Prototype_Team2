<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kiểm tra &amp; Bàn giao thiết bị | Văn Lang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/ua1.css">
  <link rel="stylesheet" href="../css/ua1-modal.css">
  <link rel="stylesheet" href="../css/ua2.css">
</head>
<body data-page="ua2" data-role="dnkt">

  <!-- Header: nạp từ components/header.html -->
  <div id="app-header"></div>

  <div class="app-body">
    <!-- Sidebar trái: nạp từ components/sidebar.html -->
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app-main">
      <main class="page">
        <div class="page-head">
          <div>
            <h1>Kiểm tra kỹ thuật &amp; Bàn giao thiết bị</h1>
            <p class="sub">Lọc đơn mượn đã duyệt theo cơ sở, quét mã QR xuất kho và kiểm tra ngoại quan khi thu hồi.</p>
          </div>
          <div class="date-chip" id="dateChip"></div>
        </div>

        <div id="pageAlert"></div>
        <div id="pageNotice"></div>

        <div class="layout" id="layout">
          <!-- Cột trái: Danh sách đơn mượn đã duyệt & Quét QR xuất/nhập kho (F79, F80, F82) -->
          <section class="card" id="handoverQueue"></section>

          <!-- Cột phải: Checklist ngoại quan bàn giao & Biên bản thu hồi/hư hỏng (F81, F83, BR1-BR3) -->
          <aside class="card" id="inspectionPanel"></aside>
        </div>
      </main>

      <div id="app-footer"></div>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="../js/main.js"></script>
  <script src="../js/ua2.js"></script>
</body>
</html>
