<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cấu hình quy định | Văn Lang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/ua1-modal.css">
  <link rel="stylesheet" href="../css/mgmt.css">
</head>
<body data-page="admin-settings">

  <!-- Header: nạp từ components/header.html -->
  <div id="app-header"></div>

  <div class="app-body">
    <!-- Sidebar trái: nạp từ components/sidebar.html -->
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app-main">
      <main class="page">
        <div class="page-head">
          <div>
            <h1>Cấu hình quy định</h1>
            <p class="sub">Các tham số mượn thiết bị và sử dụng phòng. Giá trị mới chỉ áp dụng cho phiếu mượn và lịch tạo sau thời điểm lưu.</p>
          </div>
        </div>

        <div id="cfgBanner"></div>
        <div class="stack">
          <section class="card" aria-labelledby="cfgDevTitle">
            <div class="card-head"><h2 id="cfgDevTitle">Quy định mượn thiết bị</h2></div>
            <div class="card-body"><div class="form-grid" id="grpDevice"></div></div>
          </section>
          <section class="card" aria-labelledby="cfgRoomTitle">
            <div class="card-head"><h2 id="cfgRoomTitle">Quy định sử dụng phòng</h2></div>
            <div class="card-body"><div class="form-grid" id="grpRoom"></div></div>
          </section>
        </div>
        <div class="savebar" id="savebar" hidden>
          <span id="saveText">Có thay đổi chưa lưu</span>
          <div style="display:flex;gap:10px"><button type="button" class="btn btn-outline" id="btnReset">Hoàn tác</button><button type="button" class="btn btn-primary" id="btnSave">Lưu cấu hình</button></div>
        </div>
      </main>

      <div id="app-footer"></div>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="../js/main.js"></script>
  <script src="../js/mgmt.js"></script>
  <script src="../js/admin-settings.js"></script>
</body>
</html>
