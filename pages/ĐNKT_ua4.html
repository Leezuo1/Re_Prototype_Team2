<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>UA4 - Cập nhật hồ sơ kỹ thuật &amp; giám sát thiết bị | VLU Kỹ thuật</title>
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="ua4.css">
</head>
<body>
  <div id="header-container"></div>

  <div class="app-layout">
    <div id="sidebar-container"></div>

    <main class="ua4-main">
      <div class="ua4-topbar">
        <h2>UA4 - Cập nhật hồ sơ kỹ thuật &amp; giám sát trạng thái thiết bị</h2>
        <div class="ua4-filter">
          <input type="text" id="ua4-search-input" placeholder="Tìm mã tài sản, tên thiết bị, phòng...">
          <select id="ua4-status-select">
            <option value="ALL">Tất cả trạng thái</option>
            <option value="Hoạt động tốt">Hoạt động tốt</option>
            <option value="Đang bảo trì">Đang bảo trì</option>
            <option value="Hỏng">Hỏng</option>
          </select>
          <button type="button" id="ua4-btn-export" class="btn-vlu">Xuất báo cáo kỹ thuật</button>
        </div>
      </div>

      <div class="ua4-stats">
        <div class="stat-card"><span>Hoạt động tốt</span><strong>142</strong></div>
        <div class="stat-card"><span>Đang bảo trì</span><strong>8</strong></div>
        <div class="stat-card"><span>Hỏng / Chờ thay thế</span><strong>3</strong></div>
      </div>

      <div class="ua4-card">
        <table class="ua4-table">
          <thead>
            <tr>
              <th>Mã tài sản</th>
              <th>Tên thiết bị &amp; Thông số</th>
              <th>Vị trí lắp đặt</th>
              <th>Trạng thái</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="ua4-equipment-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="ua4.js"></script>
</body>
</html>
