<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mượn – trả phòng | Văn Lang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/ua1.css">
  <link rel="stylesheet" href="../css/ua1-modal.css">
</head>
<body data-page="ua1">

  <!-- Header: nạp từ components/header.html -->
  <div id="app-header"></div>

  <div class="app-body">
    <!-- Sidebar trái: nạp từ components/sidebar.html -->
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app-main">
      <main class="page">
        <div class="page-head">
          <div>
            <h1>Mượn – trả phòng</h1>
            <p class="sub">Tìm không gian phù hợp, gửi yêu cầu và theo dõi lịch mượn của bạn.</p>
          </div>
          <div class="date-chip" id="dateChip"></div>
        </div>

        <div class="layout">
          <!-- Cột trái: Tìm phòng -->
          <section class="card" id="searchCard">
            <div class="card-head">
              <h2>Tìm phòng</h2>
              <span class="hint-ok" id="hintOk"></span>
            </div>

            <form class="filter" id="searchForm">
              <div class="field">
                <label for="fDate">Ngày mượn</label>
                <input type="date" id="fDate" value="2026-10-27">
              </div>
              <div class="field">
                <label for="fStart">Giờ bắt đầu</label>
                <input type="time" id="fStart" value="09:00">
              </div>
              <div class="field">
                <label for="fEnd">Giờ kết thúc</label>
                <input type="time" id="fEnd" value="11:00">
              </div>
              <div class="field wide">
                <label for="fCap">Sức chứa tối thiểu</label>
                <select id="fCap">
                  <option value="0">Tất cả sức chứa</option>
                  <option value="20">Từ 20 chỗ</option>
                  <option value="40">Từ 40 chỗ</option>
                  <option value="50">Từ 50 chỗ</option>
                  <option value="100">Từ 100 chỗ</option>
                  <option value="350">Từ 350 chỗ</option>
                </select>
              </div>
              <button type="submit" class="btn btn-primary" id="btnSearch"></button>
            </form>

            <div id="searchBanner"></div>

            <div class="result-bar">
              <strong id="resCount"></strong>
              <span id="resTime"></span>
            </div>

            <div class="room-grid" id="roomGrid"></div>

            <p class="note" id="noteCheck"></p>
          </section>

          <!-- Cột phải: Đơn của tôi -->
          <aside class="card">
            <div class="card-head">
              <h2>Đơn của tôi</h2>
              <span class="count" id="orderCount"></span>
            </div>

            <div id="orderBanner"></div>

            <div class="tabs" id="orderTabs">
              <button class="tab active" data-filter="all">Tất cả</button>
              <button class="tab" data-filter="pending">Chờ duyệt</button>
              <button class="tab" data-filter="approved">Đã duyệt</button>
              <button class="tab" data-filter="rejected">Bị từ chối</button>
              <button class="tab" data-filter="soon">Sắp hết giờ</button>
            </div>

            <div class="order-list" id="orderList"></div>

            <p class="note key-note" id="noteKey"></p>
          </aside>
        </div>
      </main>

      <div id="app-footer"></div>
    </div>
  </div>

  <!-- Nhắc nhở nổi + khung modal -->
  <div id="reminder"></div>
  <div id="modalRoot"></div>

  <script src="../js/main.js"></script>
  <script src="../js/ua1.js"></script>
  <script src="../js/ua1-modals.js"></script>
</body>
</html>
