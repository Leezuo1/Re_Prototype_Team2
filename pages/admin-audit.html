<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nhật ký &amp; báo cáo | Văn Lang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/ua1-modal.css">
  <link rel="stylesheet" href="../css/mgmt.css">
</head>
<body data-page="admin-audit">

  <!-- Header: nạp từ components/header.html -->
  <div id="app-header"></div>

  <div class="app-body">
    <!-- Sidebar trái: nạp từ components/sidebar.html -->
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app-main">
      <main class="page">
        <div class="page-head">
          <div>
            <h1>Nhật ký &amp; báo cáo</h1>
            <p class="sub">Truy vết ai đã làm gì, lúc nào và xuất báo cáo thống kê để gửi lãnh đạo.</p>
          </div>
        </div>

        <div class="tabs-line" id="tabs">
          <button type="button" data-tab="log" class="active" aria-selected="true">Nhật ký hoạt động</button>
          <button type="button" data-tab="report" aria-selected="false">Xuất báo cáo</button>
        </div>
        <div id="paneLog">
          <section class="card">
            <div class="toolbar toolbar-card">
              <select class="select" id="fAction" aria-label="Loại thao tác"><option value="">Mọi loại thao tác</option></select>
              <select class="select" id="fActor" aria-label="Người thực hiện"><option value="">Mọi người thực hiện</option></select>
              <label class="mono-note" for="fFrom">Từ</label><input class="input" type="date" id="fFrom" value="2026-11-01">
              <label class="mono-note" for="fTo">đến</label><input class="input" type="date" id="fTo" value="2026-11-23">
              <span class="spacer"></span>
              <span class="mono-note"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Chỉ xem, không sửa hoặc xóa</span>
            </div>
            <div class="tbl-wrap">
              <table class="tbl">
                <thead><tr><th scope="col">Thời gian</th><th scope="col">Người thực hiện</th><th scope="col">Loại thao tác</th><th scope="col">Nội dung</th></tr></thead>
                <tbody id="logRows"></tbody>
              </table>
            </div>
            <div id="logEmpty"></div>
            <div class="table-foot"><span id="logCount" aria-live="polite"></span><div class="pager" id="logPager"></div></div>
          </section>
        </div>
        <div id="paneReport" hidden>
          <div class="report-grid">
            <section class="card card-pad">
              <div class="f-field" style="margin-bottom:20px">
                <span class="lbl" id="lblType">Loại báo cáo</span>
                <div class="radio-grid" role="radiogroup" aria-labelledby="lblType" id="repTypes"></div>
              </div>
              <div class="form-grid" style="margin-bottom:20px">
                <div class="f-field" id="fgFrom"><label for="rFrom">Từ ngày *</label><input class="input" style="width:100%" type="date" id="rFrom" value="2026-09-01"><p class="error" id="rErr">“Từ ngày” phải trước hoặc bằng “Đến ngày”.</p></div>
                <div class="f-field"><label for="rTo">Đến ngày *</label><input class="input" style="width:100%" type="date" id="rTo" value="2026-11-23"></div>
              </div>
              <div class="f-field" style="margin-bottom:24px">
                <span class="lbl" id="lblFmt">Định dạng</span>
                <div class="fmt-seg" role="group" aria-labelledby="lblFmt" id="fmtSeg"><button type="button" class="active" data-v="Excel" aria-pressed="true">Excel</button><button type="button" data-v="PDF" aria-pressed="false">PDF</button></div>
              </div>
              <div id="repBanner"></div>
              <button type="button" class="btn btn-primary" id="btnExport"><svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> Xuất báo cáo</button>
            </section>
            <section class="card">
              <div class="card-head"><h2>Báo cáo đã xuất gần đây</h2></div>
              <ul class="attn" id="recentExports"></ul>
            </section>
          </div>
        </div>
      </main>

      <div id="app-footer"></div>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="../js/main.js"></script>
  <script src="../js/mgmt.js"></script>
  <script src="../js/admin-audit.js"></script>
</body>
</html>
