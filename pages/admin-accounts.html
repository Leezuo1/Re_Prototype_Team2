<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tài khoản &amp; phân quyền | Văn Lang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/ua1-modal.css">
  <link rel="stylesheet" href="../css/mgmt.css">
</head>
<body data-page="admin-accounts">

  <!-- Header: nạp từ components/header.html -->
  <div id="app-header"></div>

  <div class="app-body">
    <!-- Sidebar trái: nạp từ components/sidebar.html -->
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app-main">
      <main class="page">
        <div class="page-head">
          <div>
            <h1>Tài khoản &amp; phân quyền</h1>
            <p class="sub">Quản lý tài khoản đồng bộ từ email Microsoft của trường và vai trò của từng người.</p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn btn-primary" id="btnSync"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16M16 16h5v5"/></svg> Đồng bộ tài khoản trường</button>
          </div>
        </div>

        <div id="syncBanner"></div>

        <section class="card">
          <div class="toolbar toolbar-card">
            <div class="search">
              <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input class="input" id="q" type="search" placeholder="Tìm theo họ tên, email hoặc mã SV/GV" aria-label="Tìm tài khoản">
            </div>
            <select class="select" id="fRole" aria-label="Lọc theo vai trò"><option value="">Tất cả vai trò</option></select>
            <select class="select" id="fDept" aria-label="Lọc theo đơn vị"><option value="">Tất cả đơn vị / Khoa</option></select>
            <select class="select" id="fStatus" aria-label="Lọc theo trạng thái">
              <option value="">Mọi trạng thái</option>
              <option value="active">Hoạt động</option>
              <option value="locked">Đã khóa</option>
            </select>
          </div>
          <div class="tbl-wrap">
            <table class="tbl">
              <thead><tr>
                <th scope="col">Người dùng</th><th scope="col">Mã SV/GV</th><th scope="col">Đơn vị / Khoa</th>
                <th scope="col">Vai trò</th><th scope="col">Trạng thái</th><th scope="col"><span class="sr-only">Thao tác</span></th>
              </tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div id="emptyHost"></div>
          <div class="table-foot">
            <span id="countText" aria-live="polite"></span>
            <div class="pager" id="pager"></div>
          </div>
        </section>
      </main>

      <div id="app-footer"></div>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="../js/main.js"></script>
  <script src="../js/mgmt.js"></script>
  <script src="../js/mgmt-data.js"></script>
  <script src="../js/admin-accounts.js"></script>
</body>
</html>
